<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travel Registration</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-image: url(7.webp);
      background-size: cover;
      background-position: center;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-box {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      width: 90%;
      max-width: 450px;
    }

    .form-box h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .form-box label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }

    .form-box input,
    .form-box select,
    .form-box textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    .form-box input[type="submit"] {
      background-color: #2980b9;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
    }

    .form-box input[type="submit"]:hover {
      background-color: #1c5980;
    }
    input, textarea, select, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
 button {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
</style>
</head>
<body>

  <div class="form-box">
    <h2>Travel Registration</h2>
    <form action="#" method="post">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" required>

      <label for="destination">Destination</label>
      <select id="destination" name="destination" required>
        <option value="n1">-- Choose Destination --</option>
        <option value="n2">london</option>
        <option value="n3">India</option>
        <option value="n4">paris</option>
        <option value="n5">Itali</option>
        <option value="n6">Dubai</option>
        <option value="n7">Brazil</option>
      </select>

      <label for="date">Travel Date</label>
      <input type="date" id="date" name="date" required>

      <label for="notes">Special Requests</label>
      <textarea id="notes" name="notes" rows="3"></textarea>

      <button type="submit" onclick="registration()"><a href="C:\Users\REGAL-DP\Desktop\f.y.website\second page.html" name="image">Submit</a></button>
      </form>
  </div><!-- <script>
    function feedback(){
        alert("Thank You for submitting the form...");
    }
</script> -->


</body>
</html>
